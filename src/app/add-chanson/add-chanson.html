<div class="container">
    <div>
        <h2>Ajouter une Chanson :</h2>
    </div>
    <form>
        <div class="col-sm-2 col-md-2 col-lg-2">
            <label>ID Chanson</label>
            <input type="text" [(ngModel)]="newChanson.idChanson" name="idChanson" class="form-control">
        </div>
        <div class="col-sm-4 col-md-4 col-lg-4">
            <label>Titre Chanson</label>
            <input type="text" [(ngModel)]="newChanson.titre" name="titre" class="form-control">
        </div>
        <div class="col-sm-4 col-md-4 col-lg-4">
            <label>Artiste</label>
            <input type="text" [(ngModel)]="newChanson.artiste" name="artiste" class="form-control">
        </div>
        <div class="col-sm-2 col-md-2 col-lg-2">
            <label>Durée (min)</label>
            <input type="number" [(ngModel)]="newChanson.duree" name="duree" class="form-control">
        </div>
        <div class="col-sm-4 col-md-4 col-lg-4">
            <label>Date de création</label>
            <input type="Date" [(ngModel)]="newChanson.dateCreation" name="dateCreation" class="form-control">
        </div>
        <div class="col-sm-2 col-md-2 col-lg-2">
            <label>Genre</label>
            <select class="form-control" id="idGenre" name="idGenre" [(ngModel)]="newIdGenre">
                @for(form of genre; track form.idGenre){
                <option [value]="form.idGenre"> {{form.nomGenre}} </option>
                }
            </select>
        </div>
        <div class="mt-2">
            <button type="submit" (click)="addChanson()" class="btn btn-success">Ajouter</button>
        </div>
    </form>
</div>
